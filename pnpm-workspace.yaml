# Refuse to install on a Node older than engines.node in package.json, instead of
# failing later with an unrelated error.
engineStrict: true

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@parcel/watcher'
  - '@reown/appkit'
  - '@swc/core'
  - bufferutil
  - esbuild
  - keccak
  - utf-8-validate
